[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Pinned deliberately. Netlify changing its default Node under us is a
  # classic mystery build break, especially once sharp is in the picture.
  NODE_VERSION = "24"

# Astro content-hashes everything under /_astro/, so these are safe to cache
# forever. Netlify does NOT do this by default -- its default is
# revalidate-on-every-request, which is the biggest repeat-visit win we'd miss.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# HTML must always revalidate so deploys are picked up immediately.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), browsing-topics=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

# Keep branch/deploy previews out of the index so they never compete with
# production for the same queries.
[context.deploy-preview]
  [[context.deploy-preview.headers]]
    for = "/*"
    [context.deploy-preview.headers.values]
      X-Robots-Tag = "noindex"

[context.branch-deploy]
  [[context.branch-deploy.headers]]
    for = "/*"
    [context.branch-deploy.headers.values]
      X-Robots-Tag = "noindex"
